[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-platform"
dynamic = ["version"]
description = "Historical market data ingestion, feature engineering, and vectorized backtesting for S&P 500 equities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0,<2",
    "yfinance>=0.2.40,<2",
    "pandas>=3.0.3,<4",
    "numpy>=2.4.6,<3",
    "pyarrow>=12.0.0,<22",
    "tqdm>=4.65.0,<5",
    "vectorbt>=1.1.0,<2",
    "streamlit>=1.46.0,<2",
    "plotly>=5.15.0,<7",
    "lxml>=5.0.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "pytest-cov>=5.0.0,<7",
    "ruff>=0.6.0,<1",
]

[project.scripts]
quant-platform = "quant_platform.main:main"

[tool.setuptools.packages.find]
include = ["quant_platform*"]

[tool.setuptools.dynamic]
version = { attr = "quant_platform.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
