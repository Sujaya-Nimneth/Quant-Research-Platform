name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Verify dependency resolution
        # vectorbt 1.1+ needs numpy>=2.4.6 and pandas>=3.0.3. A looser pin makes
        # pip backtrack into an unsolvable conflict, so fail here with a clear
        # message instead of burying it in the install log.
        run: |
          python -m pip install --upgrade pip
          pip install --dry-run -r requirements.txt \
            || { echo "::error::requirements.txt does not resolve on Python ${{ matrix.python-version }}"; exit 1; }

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check quant_platform tests

      - name: Check formatting
        run: ruff format --check quant_platform tests

      - name: Run tests
        run: pytest -q
